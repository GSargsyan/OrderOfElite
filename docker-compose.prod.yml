version: '3'

services:
  nginx:
    image: ooe_nginx
    container_name: ooe_nginx
    build: ./nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/build:/opt/frontend/build
    ports:
      - "80:80"
    networks:
      - ooe_network
    depends_on:
      - backend
      - node

  psql:
    image: ooe_psql
    container_name: ooe_psql
    build: ./psql
    volumes:
      - ./psql/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ooe_db
      POSTGRES_USER: ooe
      POSTGRES_PASSWORD: ooe_pwd
    command: postgres -c max_connections=300
    networks:
      - ooe_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooe -d ooe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ooe_backend
    container_name: ooe_backend
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/:/opt/backend/
      - ./config:/opt/config:ro
    networks:
      - ooe_network
    depends_on:
      psql:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    networks:
      - ooe_network
    logging:
        driver: none

  redis:
    image: ooe_redis
    container_name: ooe_redis
    build: ./redis
    volumes:
      - ./redis/data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - ooe_network

  node:
    image: ooe_node
    container_name: ooe_node
    build: ./node
    command: npm start
    volumes:
      - ./node:/opt/node/
      - /opt/node/node_modules
    networks:
      - ooe_network
    depends_on:
      psql:
        condition: service_healthy

  celery_worker:
    image: ooe_backend
    container_name: ooe_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./backend/:/opt/backend/
    working_dir: /opt/backend
    networks:
      - ooe_network
    depends_on:
      - backend
      - redis

  celery_beat:
    image: ooe_backend
    container_name: ooe_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend/:/opt/backend/
    working_dir: /opt/backend
    networks:
      - ooe_network
    depends_on:
      - backend
      - redis

networks:
  ooe_network:
